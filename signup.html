<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Blood Bridge</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <span class="drop"></span>
      Blood Bridge
    </a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="register.html">Register Donor</a>
      <a href="search.html">Search Donor</a>
      <a href="request.html">Request Blood</a>
      <a href="donors.html">Donor List</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
      <a href="login.html">Login</a>
      <a href="signup.html" class="active">Sign Up</a>
      <a href="request.html" id="emergencyBtn" class="emergency-link">Emergency</a>
    </nav>
  </header>

  <section class="page-heading">
    <h1>Create Account</h1>
    <div class="underline"></div>
    <p class="page-desc">Sign up for a new Blood Bridge account.</p>
  </section>

  <section class="form-section">
    <div class="form-card">

      <form id="signupForm">
        <label for="signupUsername">Username</label>
        <input type="text" id="signupUsername" placeholder="Choose a username">
        <p class="error-msg" id="signupUsernameError"></p>

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Choose a password">
        <p class="error-msg" id="signupPasswordError"></p>

        <label for="signupConfirmPassword">Confirm Password</label>
        <input type="password" id="signupConfirmPassword" placeholder="Re-enter your password">
        <p class="error-msg" id="signupConfirmPasswordError"></p>

        <button type="submit" class="btn btn-primary">Sign Up</button>
        <p class="success-msg" id="signupSuccessMsg"></p>
      </form>

      <p class="switch-text">Already have an account? <a href="login.html">Login</a></p>

    </div>
  </section>

  <footer class="footer">
    <p>2026 Blood Bridge | A Project by Shreya Dhakal, Gambhir Shrestha and Reegzen Sangmo Thing</p>
  </footer>

  <button id="darkModeBtn" class="dark-toggle" aria-label="Toggle dark mode">🌙</button>

  <script src="common.js"></script>
  <script src="signup.js"></script>
</body>
</html>
