<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Blood - Blood Bridge</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/request.css">
</head>
<body>

  <!-- ===== Navbar ===== -->
  <header class="navbar">
    <a href="../index.html" class="logo">
      <span class="drop"></span>
      Blood Bridge
    </a>

     <nav class="nav-links">
      <a href="../index.html">Home</a>
      <a href="register.html">Register Donor</a>
      <a href="search.html">Search Donor</a>
      <a href="request.html" class="active">Request Blood</a>
      <a href="donors.html">Donor List</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
      <a href="request.html" id="emergencyBtn" class="emergency-link">Emergency</a>
    </nav>
  </header>

  <!-- ===== Page Heading ===== -->
  <section class="page-heading">
    <h1>Request Blood</h1>
    <div class="underline"></div>
    <p class="page-desc">Fill in this form if you or someone you know urgently needs blood.</p>
  </section>

  <!-- ===== Request Form ===== -->
  <section class="form-section">
    <form id="requestForm" class="form-card">

      <label for="reqName">Full Name</label>
      <input type="text" id="reqName" placeholder="Enter your full name">
      <p class="error-msg" id="reqNameError"></p>

      <label for="reqBloodGroup">Blood Group Needed</label>
      <select id="reqBloodGroup">
        <option value="">Select required blood group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
      </select>
      <p class="error-msg" id="reqBloodGroupError"></p>

      <label for="reqLocation">Location / Hospital</label>
      <input type="text" id="reqLocation" placeholder="e.g. Bir Hospital, Kathmandu">
      <p class="error-msg" id="reqLocationError"></p>

      <label for="reqContact">Contact Number</label>
      <input type="text" id="reqContact" placeholder="e.g. 98XXXXXXXX">
      <p class="error-msg" id="reqContactError"></p>

      <button type="submit" class="btn btn-primary">Submit Request</button>

      <p class="success-msg" id="reqSuccessMsg"></p>
    </form>
  </section>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <p>2026 Blood Bridge | A Project by Shreya Dhakal, Gambhir Shrestha and Reegzen Sangmo Thing</p>
  </footer>

  <button id="darkModeBtn" class="dark-toggle" aria-label="Toggle dark mode">🌙</button>

  <script src="../js/common.js"></script>
  <script src="../js/request.js"></script>
</body>
</html>
